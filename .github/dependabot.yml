version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/etl-manager/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/etl-manager/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/etl-manager/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/etl-manager/etls"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
