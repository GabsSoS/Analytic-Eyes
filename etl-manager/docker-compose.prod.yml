services:
  redis:
    image: redis:7-alpine
    container_name: etl-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A imagem oficial sobe como root e usa setpriv pra trocar pro usuario
    # "redis" antes de rodar o servidor - sem essas 2 capabilities o
    # entrypoint falha (setresuid/setresgid).
    cap_add:
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl-network-prod

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: etl-socket-proxy-prod
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2375"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - etl-network-prod

  etls:
    build: ./etls
    image: etls:latest
    container_name: etl-etls-image
    entrypoint: ["python", "-c", "print('etls image ready')"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sem healthcheck de proposito: o container imprime e sai (exit 0) na
    # hora - e um placeholder pra imagem ficar construida, nunca fica de pe
    # como processo de longa duracao pra um healthcheck fazer sentido.
    networks:
      - etl-network-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: etl-backend-prod
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
      python manage.py shell -c \"import os, sys; from django.contrib.auth import get_user_model; User = get_user_model(); username=os.environ.get('DJANGO_SUPERUSER_USERNAME', 'admin'); password=os.environ.get('DJANGO_SUPERUSER_PASSWORD'); email=os.environ.get('DJANGO_SUPERUSER_EMAIL', ''); sys.exit('DJANGO_SUPERUSER_PASSWORD nao configurado') if not password and not User.objects.filter(username=username).exists() else None; User.objects.filter(username=username).exists() or User.objects.create_superuser(username, email, password)\" &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-analytic-eyes.com,www.analytic-eyes.com,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://analytic-eyes.com,https://www.analytic-eyes.com,http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://analytic-eyes.com,https://www.analytic-eyes.com,http://localhost,http://127.0.0.1}
      SQLITE_PATH: /app/data/db.sqlite3
      ETL_DOCKER_NETWORK: etl-manager_etl-network-prod
      ETL_CONTAINER_MEM_LIMIT: ${ETL_CONTAINER_MEM_LIMIT:-512m}
      DOCKER_HOST: tcp://socket-proxy:2375
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_SECRET_ARN: ${DB_SECRET_ARN}
      DB_USE_SECRETS_MANAGER: ${DB_USE_SECRETS_MANAGER:-true}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      PIPELINE_STORAGE_TYPE: ${PIPELINE_STORAGE_TYPE:-local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      PIPELINE_S3_PREFIX: ${PIPELINE_S3_PREFIX:-etls}
    volumes:
      - backend_data:/app/data
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - ./etls:/etls
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
      - etls
      - socket-proxy
    networks:
      - etl-network-prod

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: etl-worker-prod
    restart: unless-stopped
    command: sh -c "celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-4} --prefetch-multiplier=1 -Ofair --max-tasks-per-child=50"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-analytic-eyes.com,www.analytic-eyes.com,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://analytic-eyes.com,https://www.analytic-eyes.com,http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://analytic-eyes.com,https://www.analytic-eyes.com,http://localhost,http://127.0.0.1}
      ETL_DOCKER_NETWORK: etl-manager_etl-network-prod
      ETL_CONTAINER_MEM_LIMIT: ${ETL_CONTAINER_MEM_LIMIT:-512m}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      DOCKER_HOST: tcp://socket-proxy:2375
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_SECRET_ARN: ${DB_SECRET_ARN}
      DB_USE_SECRETS_MANAGER: ${DB_USE_SECRETS_MANAGER:-true}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      PIPELINE_STORAGE_TYPE: ${PIPELINE_STORAGE_TYPE:-local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      PIPELINE_S3_PREFIX: ${PIPELINE_S3_PREFIX:-etls}
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
      - ./etls:/etls
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
      - etls
      - backend
      - socket-proxy
    networks:
      - etl-network-prod

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: etl-beat-prod
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-analytic-eyes.com,www.analytic-eyes.com,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://analytic-eyes.com,https://www.analytic-eyes.com,http://localhost,http://127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://analytic-eyes.com,https://www.analytic-eyes.com,http://localhost,http://127.0.0.1}
      ETL_DOCKER_NETWORK: etl-manager_etl-network-prod
      ETL_CONTAINER_MEM_LIMIT: ${ETL_CONTAINER_MEM_LIMIT:-512m}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_SECRET_ARN: ${DB_SECRET_ARN}
      DB_USE_SECRETS_MANAGER: ${DB_USE_SECRETS_MANAGER:-true}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      PIPELINE_STORAGE_TYPE: ${PIPELINE_STORAGE_TYPE:-local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      PIPELINE_S3_PREFIX: ${PIPELINE_S3_PREFIX:-etls}
    # Sem mount de ./etls: o beat so agenda (publica mensagens na fila do
    # Celery), nunca executa execute_pipeline nem toca em arquivos de ETL -
    # isso sempre roda no worker. Ver pipelines/tasks.py.
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p='/app/celerybeat-schedule'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
      - backend
    networks:
      - etl-network-prod

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: etl-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # O master process do nginx sobe como root pra poder abrir a porta 80
    # (privilegiada), ajustar o dono do cache (/var/cache/nginx/*) e depois
    # derrubar privilegio pros workers (usuario "nginx", ver nginx.conf) -
    # testado sem essas 4 capabilities e o container nao sobe.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - backend
    volumes:
      - backend_static:/app/staticfiles:ro
      - backend_media:/app/media:ro
    networks:
      - etl-network-prod

volumes:
  backend_data:
  backend_static:
  backend_media:

networks:
  etl-network-prod:
    driver: bridge
