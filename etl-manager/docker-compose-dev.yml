services:
  redis:
    image: redis:7
    container_name: etl-redis
    # REDIS_PASSWORD vazio = sem auth (comportamento antigo, ok em dev).
    # Defina no .env se quiser testar com autenticação igual produção.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: etl_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d etl_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl-network

  etls:
    build: ./etls
    image: etls:latest
    security_opt:
      - no-new-privileges:true
    networks:
      - etl-network

  # Proxy que restringe o que backend/worker podem fazer no Docker daemon do
  # host, para nao ter que montar /var/run/docker.sock direto neles (mesmo
  # padrao usado em docker-compose.prod.yml).
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
    security_opt:
      - no-new-privileges:true
    networks:
      - etl-network

  frontend:
    build: ./frontend
    container_name: etl-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/
    command: npm run dev -- --host
    ports:
      - "127.0.0.1:5173:5173"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - etl-network
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: etl-backend
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin')\" &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./etls:/etls
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=True
      - ETL_HOST_PATH=${ETL_HOST_PATH}
      - ETL_DOCKER_NETWORK=etl-network
      - DOCKER_HOST=tcp://socket-proxy:2375
      - PIPELINE_STORAGE_TYPE=${PIPELINE_STORAGE_TYPE}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - PIPELINE_S3_PREFIX=${PIPELINE_S3_PREFIX}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
      - postgres
      - socket-proxy
    networks:
      - etl-network

  worker:
    build: ./backend
    command: sh -c "celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-30} --prefetch-multiplier=1 -Ofair --max-tasks-per-child=50"
    volumes:
      - ./backend:/app
      - ./etls:/etls
    environment:
      - ETL_HOST_PATH=${ETL_HOST_PATH}
      - ETL_DOCKER_NETWORK=etl-network
      - DOCKER_HOST=tcp://socket-proxy:2375
      - CELERY_WORKER_CONCURRENCY=30
      - ETL_CONTAINER_MEM_LIMIT=512m
      - ETL_CONTAINER_CPUSET=
      - PIPELINE_STORAGE_TYPE=${PIPELINE_STORAGE_TYPE}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - PIPELINE_S3_PREFIX=${PIPELINE_S3_PREFIX}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
      - postgres
      - socket-proxy
    networks:
      - etl-network

  beat:
    build: ./backend
    command: sh -c "celery -A config beat -l info"
    # Sem mount de ./etls: o beat so agenda (publica mensagens na fila do
    # Celery), nunca executa execute_pipeline nem toca em arquivos de ETL -
    # isso sempre roda no worker. Ver pipelines/tasks.py.
    volumes:
      - ./backend:/app
    environment:
      - ETL_HOST_PATH=${ETL_HOST_PATH}
      - ETL_DOCKER_NETWORK=etl-network
      - PIPELINE_STORAGE_TYPE=${PIPELINE_STORAGE_TYPE}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - PIPELINE_S3_PREFIX=${PIPELINE_S3_PREFIX}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p='/app/celerybeat-schedule'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
      - postgres
      - backend
    networks:
      - etl-network




volumes:
  postgres_data:
  frontend_node_modules:

networks:
  etl-network:
    name: etl-network
    driver: bridge
